<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>

<div class="custom-dropdown" id="myDropdown">
  <div class="dropdown-header">
    <span class="selected-text">Select an Item</span>
    <span class="arrow-icon">v</span> 
  </div>

  <ul class="dropdown-list">
    <li data-value="1">First Item</li>
    <li data-value="2">Second Item</li>
    <li data-value="3">Third Item</li>
    <li data-value="4">Fourth Item</li>
    <li data-value="5">Fifth Item</li>
  </ul>
</div>

<script src="scripts.js" defer></script> 

</body>
</html>
